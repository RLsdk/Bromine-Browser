<!DOCTYPE html>
<html lang="en" data-theme="bromine" style="background:#161210;color-scheme:dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark" />
  <title>New Tab</title>
  <link rel="stylesheet" href="start.css" />
</head>
<body style="background:#161210;margin:0;min-height:100%;color-scheme:dark">
  <div class="bg" aria-hidden="true"></div>

  <main>
    <time id="clock" datetime="">00:00</time>
    <p id="date"></p>

    <form id="search" action="https://duckduckgo.com/" method="get" role="search" autocomplete="off">
      <input type="hidden" name="kae" value="d" id="engine-extra" />

      <div class="engine-picker" id="engine-picker">
        <button type="button" id="engine-btn" class="engine-btn" aria-haspopup="listbox" aria-expanded="false" aria-label="Search engine" title="Search engine">
          <span id="engine-icon" class="engine-icon" aria-hidden="true"></span>
        </button>
        <div id="engine-menu" class="engine-menu" role="listbox" hidden>
          <button type="button" role="option" data-engine="ddg" title="DuckDuckGo" aria-label="DuckDuckGo"></button>
          <button type="button" role="option" data-engine="ddg-html" title="DuckDuckGo HTML" aria-label="DuckDuckGo HTML"></button>
          <button type="button" role="option" data-engine="brave" title="Brave" aria-label="Brave"></button>
          <button type="button" role="option" data-engine="searx" title="SearXNG" aria-label="SearXNG"></button>
        </div>
      </div>

      <input id="q" type="text" name="q" placeholder="Search the web" autocomplete="off" />
      <button type="button" id="clear" class="icon-btn clear-btn" aria-label="Clear" tabindex="-1" aria-hidden="true">×</button>
      <span class="search-divider" aria-hidden="true"></span>
      <button type="submit" class="icon-btn search-submit" aria-label="Search">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
          <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M20 20l-3.5-3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
    </form>
  </main>

  <p class="credit">Bromine · privacy-first start</p>

  <script src="start.js"></script>
</body>
</html>
